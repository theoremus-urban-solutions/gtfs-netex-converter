name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.21, 1.22, 1.23]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.4.0

    - name: Run golangci-lint
      run: golangci-lint run

  epip:
    name: EPIP conformance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Convert the test feeds
      run: |
        go build -o conv ./cmd/gtfs-netex-converter
        mkdir -p out
        for f in allfields calendar sofia-example sofia-slice; do
          ./conv -input stream/testdata/$f.zip -output out/$f.xml -publication-time 2026-01-01T00:00:00
        done
        for f in stream/testdata/edge/*.zip; do
          ./conv -input $f -output out/edge-$(basename $f .zip).xml -publication-time 2026-01-01T00:00:00
        done

    - name: Fetch the EPIP and NeTEx v2.0.0 schemas
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-utils
        git clone https://github.com/TransmodelEcosystem/NeTEx-Profile-EPIP.git schemas/epip
        git -C schemas/epip checkout e5eaf83f15f7fd8db7991a4a8323b6ff7905c13a
        git clone --depth 1 --branch v2.0.0 --filter=blob:none --sparse https://github.com/TransmodelEcosystem/NeTEx.git schemas/netex
        git -C schemas/netex sparse-checkout set xsd

    - name: Strict EPIP schema
      run: xmllint --noout --schema schemas/epip/NeTEx_publication_EPIP.xsd out/*.xml

    - name: NeTEx v2.0.0 schema
      run: xmllint --noout --schema schemas/netex/xsd/NeTEx_publication.xsd out/*.xml

    - name: Greenlight EPIP rules
      run: |
        docker run --rm -v "$PWD/out:/data:ro" itxpt/greenlight:1.1.2 validate -i /data -s epip@1.1.2 -o json -l error > greenlight.json
        python3 -c "import glob, json; d=json.load(open('greenlight.json')); bad=[(doc['name'], r['name']) for doc in d for r in doc['validations'] if not r['valid']]; print(len(d), 'files checked, failing:', bad); exit(1 if bad or len(d) != len(glob.glob('out/*.xml')) else 0)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, epip]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: |
        go build -v ./cmd/gtfs-netex-converter

    - name: Build for multiple platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o gtfs-netex-converter-linux-amd64 ./cmd/gtfs-netex-converter
        GOOS=linux GOARCH=arm64 go build -o gtfs-netex-converter-linux-arm64 ./cmd/gtfs-netex-converter
        GOOS=darwin GOARCH=amd64 go build -o gtfs-netex-converter-darwin-amd64 ./cmd/gtfs-netex-converter
        GOOS=darwin GOARCH=arm64 go build -o gtfs-netex-converter-darwin-arm64 ./cmd/gtfs-netex-converter
        GOOS=windows GOARCH=amd64 go build -o gtfs-netex-converter-windows-amd64.exe ./cmd/gtfs-netex-converter

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          gtfs-netex-converter-linux-*
          gtfs-netex-converter-darwin-*
          gtfs-netex-converter-windows-*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, epip, build]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v5
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
